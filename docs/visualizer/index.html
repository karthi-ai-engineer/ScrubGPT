<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrubGPT Process Visualizer</title>
<meta name="description" content="How each ScrubGPT phase turns data into the next phase's input: inputs, animated processing, outputs and connections. Fixture and synthetic data only.">
<style>
:root{
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,"Noto Sans Mono CJK JP",monospace;
  color-scheme:light;
  --bg:#f5f6f8; --panel:#ffffff; --stage:#fbfbfc; --ink:#141820; --ink2:#465061; --muted:#7c8696; --line:#d3d8e0;
  --dev1:#2563c9; --dev1-bg:#e7effd; --dev2:#23824a; --dev2-bg:#e3f4e9;
  --amber:#c08400; --amber-ink:#8a5d00; --amber-bg:#fff4d4;
  --ok:#1b7f45; --ok-bg:#e1f3e8; --mark:#ffe28a; --mark-done:#fff1c2; --focus:#1d5fd1;
  --tok-bg:#fff8e2; --tok-ink:#3d2a00; --term-bg:#12161c; --term-ink:#d9e0e8; --term-dim:#8b97a6; --term-ok:#5ad38f;
  --ghost:#9aa3b0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1116; --panel:#161a21; --stage:#12161c; --ink:#e6ebf1; --ink2:#a9b3c1; --muted:#7f8a99; --line:#2b333e;
    --dev1:#79a8ff; --dev1-bg:#15233a; --dev2:#5ccb88; --dev2-bg:#11291b;
    --amber:#f0b429; --amber-ink:#f3c450; --amber-bg:#30260c;
    --ok:#56d18d; --ok-bg:#12301f; --mark:#7a5d0f; --mark-done:#3a2f10; --focus:#8ab4ff;
    --tok-bg:#3a2e0e; --tok-ink:#ffe9b0; --term-bg:#080a0d; --ghost:#5b6574;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116; --panel:#161a21; --stage:#12161c; --ink:#e6ebf1; --ink2:#a9b3c1; --muted:#7f8a99; --line:#2b333e;
  --dev1:#79a8ff; --dev1-bg:#15233a; --dev2:#5ccb88; --dev2-bg:#11291b;
  --amber:#f0b429; --amber-ink:#f3c450; --amber-bg:#30260c;
  --ok:#56d18d; --ok-bg:#12301f; --mark:#7a5d0f; --mark-done:#3a2f10; --focus:#8ab4ff;
  --tok-bg:#3a2e0e; --tok-ink:#ffe9b0; --term-bg:#080a0d; --ghost:#5b6574;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:16px;top:8px;background:var(--panel);padding:6px 10px;border-radius:6px;z-index:5}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--dev1)}
code,.mono{font-family:var(--mono)}
header.top{padding:24px 0 4px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end}
.kicker{margin:0;color:var(--ink2);font-size:13px}
h1{font-size:28px;line-height:1.25;margin:2px 0 0}
.toggles{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.intro{max-width:86ch;color:var(--ink2);margin:14px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2);margin:6px 0;align-items:center}
.legend b{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1.5px solid}
.sw.d1{background:var(--dev1-bg);border-color:var(--dev1)} .sw.d2{background:var(--dev2-bg);border-color:var(--dev2)} .sw.ct{background:var(--amber-bg);border-color:var(--amber)}
.trust{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
nav.secnav ul{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:12px 0 0}
nav.secnav a{display:inline-block;padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;background:var(--panel)}
nav.secnav a.dim{color:var(--muted);border-style:dashed}
.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:20px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber-ink);margin:0}
h2{margin:2px 0 4px;font-size:22px;line-height:1.3}
.meta{margin:0;color:var(--ink2);font-size:13px}
.summary{margin:8px 0 0;max-width:96ch}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 10px}
.btn{font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;min-height:36px;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--ink2)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn .ic{font-size:12px;line-height:1}
.speed{display:inline-flex;gap:6px;align-items:center;font-size:14px;margin-left:4px}
.speed select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);min-height:36px}
.rmnote{font-size:13px;color:var(--amber-ink);margin-left:6px}
.stages{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0;margin:0 0 12px}
.stages button{width:100%;height:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px 8px;cursor:pointer;position:relative;overflow:hidden;font-size:12.5px;line-height:1.35;display:flex;gap:6px;align-items:flex-start}
.stages .num{font-family:var(--mono);font-weight:700;color:var(--ink2);white-space:nowrap;flex:none}
.stages button[aria-current="step"]{border-color:var(--amber);background:var(--amber-bg)}
.stages button[aria-current="step"] .num{color:var(--amber-ink)}
.stages button.done .num::after{content:" ✓";color:var(--ok)}
.stages .prog{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--amber);transform-origin:0 50%;transform:scaleX(0)}
.grid{display:grid;grid-template-columns:200px minmax(0,1fr) 230px;gap:16px;align-items:start}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:2px 0 8px}
.col ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.io{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45;background:var(--bg)}
.io .t{font-weight:600;display:block}
.io .p{font-family:var(--mono);font-size:11px;color:var(--ink2);word-break:break-all;display:block}
.io.active{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.outputs .io{opacity:.5;border-style:dashed}
.outputs .io.made{opacity:1;border-style:solid}
.outputs .io.made .t::before{content:"✓ ";color:var(--ok)}
.outputs .to{display:block;margin-top:4px;font-size:12px}
.outputs .to a{margin-right:6px}
.stagebox{min-width:0}
.stage-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--stage)}
.stage-scroll svg{display:block;width:100%;min-width:780px;height:auto}
.caption{min-height:5.2em;margin:10px 2px 0;font-size:14px;line-height:1.6}
.caption b{display:block}
.upcoming h2{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.ph{border:1.5px dashed var(--line);border-radius:12px;padding:14px;background:var(--bg);color:var(--ink2);font-size:13px}
.ph h3{margin:2px 0;font-size:16px;color:var(--ink2)}
.ph .when{font-size:12px;color:var(--muted);margin:0 0 8px}
.ph .will{margin:0 0 8px}
.ph ul{margin:4px 0 0;padding-left:0;list-style:none;display:grid;gap:4px}
.ph li{padding-left:16px;position:relative}
.ph li::before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--line)}
.ph li.p0::before{background:var(--amber)}
.ph li.p0 .from{font-size:11px;color:var(--amber-ink);margin-left:4px;white-space:nowrap}
.ph.fed{border-color:var(--amber);border-style:solid}
.ph.fed h3{color:var(--ink)}
footer{color:var(--ink2);font-size:13px;padding-bottom:40px}
@media (max-width:1100px){.grid{grid-template-columns:1fr}.col ul{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (max-width:900px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:23px}.section{padding:14px}}
/* ---------- SVG stage ---------- */
.sv{font-family:var(--sans)}
.sv text{fill:var(--ink)}
.sv .mono{font-family:var(--mono)}
.sv .b{font-weight:700}
.sv .t2{fill:var(--ink2)} .sv .mut{fill:var(--muted)}
.sv .c1{fill:var(--dev1)} .sv .c2{fill:var(--dev2)} .sv .ca{fill:var(--amber-ink)} .sv .okf{fill:var(--ok)}
.sv .p1{fill:var(--dev1-bg);stroke:var(--dev1);stroke-width:1.5}
.sv .p2{fill:var(--dev2-bg);stroke:var(--dev2);stroke-width:1.5}
.sv .pa{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}
.sv .pn{fill:var(--panel);stroke:var(--line);stroke-width:1}
.sv .pg{fill:none;stroke:var(--ghost);stroke-width:1.2;stroke-dasharray:5 4}
.sv .ln{fill:none;stroke:var(--line);stroke-width:1.5}
.sv .lk{fill:none;stroke:var(--amber);stroke-width:2}
.sv .lk1{fill:none;stroke:var(--dev1);stroke-width:3}
.sv .lk2{fill:none;stroke:var(--dev2);stroke-width:3}
.sv .lkm{fill:none;stroke:var(--muted);stroke-width:3}
.sv .frame{fill:none;stroke:var(--amber);stroke-width:2.5}
.sv .dot{fill:var(--amber)} .sv .dotm{fill:var(--muted)} .sv .dot1{fill:var(--dev1)} .sv .dot2{fill:var(--dev2)}
.sv .okc{fill:var(--ok)} .sv .okbg{fill:var(--ok-bg);stroke:var(--ok);stroke-width:1.5}
.sv .chip{fill:var(--panel);stroke:var(--dev1);stroke-width:1}
.sv .tok rect{fill:var(--tok-bg);stroke:var(--amber);stroke-width:1.2}
.sv .tok text{fill:var(--tok-ink)}
.sv .tok.t1 rect{stroke:var(--dev1)} .sv .tok.ok rect{fill:var(--ok-bg);stroke:var(--ok)} .sv .tok.ok text{fill:var(--ok)}
.sv .term{fill:var(--term-bg)}
.sv .tl{fill:var(--term-ink)} .sv .tc{fill:var(--term-dim)} .sv .tp{fill:var(--term-ok);font-weight:700}
.sv .slot{fill:none;stroke:var(--line);stroke-width:1.5}
.sv .lit .slot{stroke:var(--ok)}
.sv .meterbg{fill:var(--panel);stroke:var(--line)} .sv .meterfill{fill:var(--amber)}
.sv .limit{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:3 3}
/* foreignObject HTML (stage 5) */
.fo{position:relative;font:11px/1.35 var(--sans);color:var(--ink);height:100%}
.fo .mono{font-family:var(--mono)}
.fo .ja,.fo .en{display:block}
.fo .en{color:var(--ink2)}
.fo .muted{color:var(--muted)}
.card5{height:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:7px 10px}
.card5 .hd{font-size:10.5px;color:var(--ink2);margin-bottom:3px}
.card5 .big{font-size:13px}
.qcard{border-color:var(--dev2)}
.atext{font-size:14.5px;line-height:1.75;margin:4px 0 6px}
.atext .q{border-radius:3px;padding:1px 0}
.atext .q.hot{background:var(--mark);box-shadow:0 0 0 2px var(--amber)}
.atext .q.done{background:var(--mark-done);text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px}
.atext sup{font-size:10px;color:var(--amber-ink);font-weight:700;visibility:hidden}
.atext sup.on{visibility:visible}
.rec{height:100%;border:1.5px solid var(--amber);border-radius:10px;background:var(--panel);padding:6px 8px}
.rec .rh{font-size:11px;font-weight:700;margin:0 0 1px}
.rec .rs{font-size:10px;color:var(--ink2);margin:0 0 4px}
.row{display:grid;grid-template-columns:142px minmax(0,1fr) 20px;gap:6px;padding:3px 4px;border-top:1px solid var(--line);align-items:start}
.row .path{font-family:var(--mono);font-size:10.5px;color:var(--ink2);padding-top:1px}
.row .val{visibility:hidden}
.row .bd{font-size:11px;font-weight:700;color:var(--amber-ink);visibility:hidden;text-align:right}
.row.on .val,.row.on .bd{visibility:visible}
.row.hot{background:var(--mark-done)}
.row.null .val{color:var(--muted);font-style:italic}
.row .meta5{display:block;font-size:10px;color:var(--muted)}
.tag5{display:inline-block;font-size:10px;padding:0 5px;border:1px solid var(--line);border-radius:4px;color:var(--ink2)}
.mbox{border:1px dashed var(--muted)}
.mf{display:inline-block;font-family:var(--mono);font-size:10.5px;border:1.5px dashed var(--amber);border-radius:5px;padding:2px 6px;margin:2px 4px 2px 0;visibility:hidden;background:var(--bg)}
.mf.on{visibility:visible}
.mf i{font-family:var(--sans);font-style:normal;color:var(--muted);margin-left:6px}
.vbox{opacity:.45}
.vbox.on{opacity:1;border-color:var(--ink2)}
.note5{font-size:10px;color:var(--ink2);margin-top:4px}
</style>
</head>
<body>
<a class="skip" href="#phase-0" data-i18n="skip">Skip to Phase 0</a>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div>
        <p class="kicker" data-i18n="kicker">ScrubGPT · Surgical Knowledge System (MVP) · MY ROBOTS</p>
        <h1 data-i18n="title">Process Visualizer</h1>
      </div>
      <div class="toggles">
        <div class="seg" role="group" data-i18n-aria="langGroup" aria-label="Language">
          <button type="button" data-lang="en" lang="en">English</button>
          <button type="button" data-lang="ja" lang="ja">日本語</button>
        </div>
        <div class="seg" role="group" data-i18n-aria="themeGroup" aria-label="Theme">
          <button type="button" data-theme-set="auto" data-i18n="themeAuto">Auto</button>
          <button type="button" data-theme-set="light" data-i18n="themeLight">Light</button>
          <button type="button" data-theme-set="dark" data-i18n="themeDark">Dark</button>
        </div>
      </div>
    </div>
    <p class="intro" data-i18n="intro"></p>
    <div class="legend" id="legend"></div>
    <nav class="secnav" id="secnav" data-i18n-aria="navLabel" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap"><p data-i18n="footer"></p></footer>
<script>
'use strict';
/* ==========================================================================
   ScrubGPT Process Visualizer (plan §14, D-029, D-039). One offline file.

   HOW TO ADD A SECTION (orchestrator, last step of each block merge):
   1. Add a definition to SECTIONS (see PHASE0): id, nav, eyebrow, title, meta,
      summary, inputs[], outputs[] and stages[]. A stage is
      { dur, title, caption, inputs:[input ids], build(g) -> { update(p) } }.
      update(p) must be a pure function of p in [0, 1]; p = 1 is the stage's end
      state (used by Step and by reduced motion).
   2. Mark its card in PLACEHOLDERS as built:true (the card disappears).
   3. Animation rule: everything that moves is data (files, fields, requests,
      check marks). No decorative motion.
   4. Every string in both languages: b(en, ja). Repo-relative paths only.
      Fixture or synthetic data and derived numbers only; never real frames.
   Test helpers: ?stage=N (1-based, opens Phase 0 at stage N's end state; add
   &p=0.4 for a frame part-way through),
   ?lang=ja|en, ?theme=light|dark.
   ========================================================================== */
(function () {
const b = (en, ja) => ({ en, ja });
const q = new URLSearchParams(location.search);
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } return null; }
let LANG = q.get('lang') || store('viz.lang') || ((navigator.language || 'en').toLowerCase().startsWith('ja') ? 'ja' : 'en');
if (LANG !== 'ja' && LANG !== 'en') LANG = 'en';
const RM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false, addEventListener() {} };
const L = (x) => (x && typeof x === 'object' && 'en' in x) ? x[LANG] : x;
const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------------------------------------------------------- strings */
const UI = {
  skip: b('Skip to Phase 0', 'Phase 0 へ移動'),
  kicker: b('ScrubGPT · Surgical Knowledge System (MVP) · MY ROBOTS', 'ScrubGPT · 手術知識システム（MVP）· MY ROBOTS'),
  title: b('Process Visualizer', 'プロセス・ビジュアライザー'),
  langGroup: b('Language', '言語'),
  themeGroup: b('Theme', 'テーマ'),
  themeAuto: b('Auto', '自動'), themeLight: b('Light', 'ライト'), themeDark: b('Dark', 'ダーク'),
  navLabel: b('Sections', 'セクション'),
  intro: b('How each phase turns data into the next phase\'s input. Every section shows its inputs, the processing inside (step by step), its outputs, and the links to the sections that use them. Everything that moves is data: files, fields, requests and check marks. The page uses only fixture or synthetic data and numbers derived from it; it contains no surgical video.',
    '各フェーズがデータをどのように次のフェーズの入力へ変えるかを示します。各セクションは、入力、内部の処理（ステップごと）、出力、そしてその出力を使うセクションへの接続を表示します。動くものはすべてデータ（ファイル、フィールド、リクエスト、チェックマーク）です。このページはフィクスチャ（合成）データとそこから導いた数値だけを使い、手術映像は含みません。'),
  lgDev1: b('Dev1 · Brain track', 'Dev1 · Brain トラック'),
  lgDev2: b('Dev2 · App track', 'Dev2 · App トラック'),
  lgCt: b('Contracts (shared)', 'コントラクト（共有）'),
  lgTrust: b('Trust labels:', '信頼ラベル：'),
  play: b('Play', '再生'), pause: b('Pause', '一時停止'), step: b('Step', 'ステップ'), restart: b('Restart', '最初から'), speed: b('Speed', '速度'),
  ctrlGroup: b('{name} animation controls', '{name} アニメーションの操作'),
  stageList: b('Stages', '段階'),
  stageBtn: b('Stage {n}: {t}', '段階 {n}：{t}'),
  stageOf: b('Stage {n} of {m}', '段階 {n}/{m}'),
  ready: b('Ready. Press Play, or Step to go one stage at a time.', '準備完了。「再生」、または1段階ずつ進む「ステップ」を押してください。'),
  rmOn: b('Reduced motion is on: nothing plays by itself, and Step shows each stage\'s end state.', 'モーション軽減が有効です。自動再生はせず、「ステップ」で各段階の最終状態を表示します。'),
  inputs: b('Inputs', '入力'), outputs: b('Outputs', '出力'),
  usedBy: b('Used by:', '使用先：'),
  comingTitle: b('Coming next', '今後追加されるセクション'),
  comingIntro: b('Each block adds its own animated section here after its merge. Until then these cards only list what the block will take in. Amber dots mark inputs that come from Phase 0.',
    '各ブロックはマージ後にここへアニメーション付きのセクションを追加します。それまでは、そのブロックが受け取る入力だけを示します。琥珀色の点は Phase 0 から来る入力です。'),
  willShow: b('Will show:', '表示予定：'),
  takesIn: b('Takes in:', '入力：'),
  fromP0: b('from Phase 0', 'Phase 0 から'),
  afterBlock: b('Added after the Block {n} merge', 'Block {n} のマージ後に追加'),
  afterInt: b('Added after Block 5 and integration', 'Block 5 と統合の後に追加'),
  footer: b('Data on this page: fixture or synthetic data from contracts/fixtures/ and numbers derived from it (D-039). Test counts, commit and dates are real (PR #15). One offline file: no network, no libraries, no build step.',
    'このページのデータ：contracts/fixtures/ のフィクスチャ（合成）データと、そこから導いた数値のみ（D-039）。テスト件数・コミット・日付は実際の値（PR #15）です。ネットワーク・ライブラリ・ビルド手順を使わない単一のオフラインファイルです。'),
  fixtureNote: b('From the fixture case (synthetic)', 'フィクスチャ症例（合成データ）より'),
  realNote: b('Real numbers from PR #15', 'PR #15 の実際の数値')
};

  { id: 'block-2', n: 2, title: b('Block 2 · Seeing and listening', 'Block 2 · 見る・聞く'),
    will: b('12-frame windows flying to GPT; per-step probability bars; Viterbi snapping noisy guesses into clean, ordered step segments; audio turning into timestamped JA/EN utterances with class tags.', '12 フレームの窓が GPT へ、ステップごとの確率バー、Viterbi が雑な推定を順序正しいステップ区間へ、音声がタイムスタンプ付きの日英発話（分類タグ付き）へ。'),
    inputs: [[0, b('Normalised videos and sampled frames (Block 1)', '正規化動画と抽出フレーム（Block 1）')], [0, b('Rule book and step atlas (Block 1)', 'ルールブックとステップアトラス（Block 1）')], [0, b('Audio of the narrated cases', 'ナレーション付き症例の音声')], [1, b('Fake case timeline (Control Room replay, J2)', 'フェイク症例のタイムライン（Control Room の再生、J2）')]] },
  { id: 'block-3', n: 3, title: b('Block 3 · Moments and questions', 'Block 3 · モーメントと質問'),
    will: b('The case timeline sliding against the rule book; deviations lighting up; moments ranked and clipped; question cards assembling from moment + quote + tap options.', '症例タイムラインとルールブックの照合、逸脱の検出、モーメントのランク付けと切り出し、モーメント＋引用＋タップ選択肢からの質問カード組み立て。'),
    inputs: [[0, b('timeline.json for the golden cases (Block 2)', 'ゴールデン症例の timeline.json（Block 2）')], [1, b('Brain API + fake Brain :8101 (I7 brain client, J3 answer loop)', 'Brain API＋フェイク Brain :8101（I7 Brain クライアント、J3 回答ループ）')], [1, b('Fake case questions and clips', 'フェイク症例の質問とクリップ')], [1, b('Decision Record Draft shape', '判断記録ドラフトの形')]] },
  { id: 'block-4', n: 4, title: b('Block 4 · Runtime Brain + knowledge screens', 'Block 4 · 実行時 Brain＋知識画面'),
    will: b('A spoken answer → transcript → Decision Record fields filling one by one with their grounding quotes → the surgeon confirms → a new node joins the knowledge graph; an Ask query retrieving records and citing clips.', '音声回答 → 書き起こし → 判断記録のフィールドが根拠の引用とともに 1 つずつ埋まる → 外科医が確認 → 知識グラフに新しいノード。Ask が記録を検索しクリップを引用。'),
    inputs: [[1, b('Brain API contract (the real Brain implements it on :8100)', 'Brain API コントラクト（本物の Brain が :8100 で実装）')], [1, b('Fake Brain shapes, checked by scrubgpt-validate live', 'フェイク Brain の形（scrubgpt-validate live で検証）')], [1, b('Seed records 🧪 / 🎙️ (Library, Ask)', 'シード記録 🧪 / 🎙️（ライブラリ、Ask）')], [0, b('Full case packages for GC1 and GC2 (Block 3)', 'GC1・GC2 の完全な症例パッケージ（Block 3）')]] },
  { id: 'block-5', n: 5, int: true, title: b('Block 5 / integration', 'Block 5 / 統合'),
    will: b('The fake case and the fake Brain being swapped for the real ones; the full loop running end to end.', 'フェイク症例とフェイク Brain を本物に置き換え、全体のループを端から端まで実行。'),
    inputs: [[0, b('Real case packages (Blocks 1–3, Friday drops)', '本物の症例パッケージ（Block 1–3、金曜のドロップ）')], [0, b('Real Brain :8100 (Block 4)', '本物の Brain :8100（Block 4）')], [1, b('Fake case + fake Brain, to be swapped out', 'フェイク症例＋フェイク Brain（置き換え対象）')], [1, b('scrubgpt-validate on every real package', 'すべての本物のパッケージに scrubgpt-validate')]] }
];

/* ======================================================= the player */
const players = [];
let running = false, last = 0;
function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; let any = false;
  players.forEach((pl) => { any = pl.tick(dt) || any; });
  if (any) requestAnimationFrame(frame); else running = false;
}
function Player(def, root) {
  this.def = def; this.root = root; this.stage = 0; this.p = 0; this.state = 'idle'; this.hold = 0; this.speed = 1;
  this.builtKey = ''; this.started = false;
  this.svg = root.querySelector('svg'); this.cap = root.querySelector('.caption');
}
Player.prototype.n = function () { return this.def.stages.length; };
Player.prototype.render = function () {
  const key = this.stage + ':' + LANG;
  if (key !== this.builtKey) {
    while (this.svg.firstChild) this.svg.removeChild(this.svg.firstChild);
    const g = E('g', {}, this.svg); this.scene = this.def.stages[this.stage].build(g); this.builtKey = key;
  }
  this.scene.update(this.p); this.sync();
};
Player.prototype.sync = function () {
  const r = this.root, st = this.stage, p = this.p, def = this.def;
  r.querySelectorAll('.stages button').forEach((btn, i) => {
    if (i === st) btn.setAttribute('aria-current', 'step'); else btn.removeAttribute('aria-current');
    cls(btn, 'done', i < st || (i === st && p >= 1));
    const pr = btn.querySelector('.prog'); const v = i < st ? 1 : i === st ? p : 0; const sv = 'scaleX(' + v.toFixed(3) + ')';
    if (pr._v !== sv) { pr._v = sv; pr.style.transform = sv; }
  });
  const used = def.stages[st].inputs || [];
  r.querySelectorAll('.inputs .io').forEach((li) => cls(li, 'active', used.includes(li.dataset.id)));
  r.querySelectorAll('.outputs .io').forEach((li) => { const at = +li.dataset.at; cls(li, 'made', st > at || (st === at && p >= 0.97)); });
  const playBtn = r.querySelector('[data-act="play"]'), pauseBtn = r.querySelector('[data-act="pause"]');
  playBtn.setAttribute('aria-pressed', this.state === 'playing' ? 'true' : 'false');
  pauseBtn.setAttribute('aria-pressed', this.state === 'idle' && this.started ? 'true' : 'false');
  if (def.id === 'phase-0') {
    const fed = (st === this.n() - 1 && this.scene && this.scene.fed) ? this.scene.fed : [];
    document.querySelectorAll('.ph').forEach((c) => cls(c, 'fed', fed.includes(c.id)));
  }
};
Player.prototype.announce = function () {
  const st = this.def.stages[this.stage];
  this.cap.innerHTML = '<b>' + esc(t('stageOf', { n: this.stage + 1, m: this.n() }) + ' · ' + L(st.title)) + '</b>' + esc(L(st.caption));
};
Player.prototype.go = function (i, p) { const changed = i !== this.stage || !this.announced; this.stage = i; this.p = p; this.render(); if (changed) { this.announce(); this.announced = true; } };
Player.prototype.tick = function (dt) {
  if (this.state === 'idle') return false;
  const sp = this.speed;
  if (RM.matches) { // step-through slideshow: end states only, no tweening
    this.hold += dt * sp;
    if (this.hold >= 4) { this.hold = 0; if (this.stage < this.n() - 1) this.go(this.stage + 1, 1); else { this.state = 'idle'; this.sync(); } }
    return this.state !== 'idle';
  }
  if (this.p < 1) {
    this.p = Math.min(1, this.p + dt * sp / this.def.stages[this.stage].dur); this.render();
    if (this.p >= 1 && this.state === 'stepping') { this.state = 'idle'; this.sync(); }
    return this.state !== 'idle';
  }
  this.hold += dt * sp;
  if (this.hold >= 1.3) { this.hold = 0; if (this.stage < this.n() - 1) this.go(this.stage + 1, 0); else { this.state = 'idle'; this.sync(); } }
  return this.state !== 'idle';
};
Player.prototype.ensureAnnounced = function () { if (!this.announced) { this.announce(); this.announced = true; } };
Player.prototype.play = function () {
  this.started = true; this.ensureAnnounced();
  if (this.stage === this.n() - 1 && this.p >= 1) this.go(0, RM.matches ? 1 : 0);
  if (RM.matches && this.p < 1) this.go(this.stage, 1);
  this.state = 'playing'; this.hold = 0; this.sync(); kick();
};
Player.prototype.pause = function () { this.started = true; this.state = 'idle'; this.sync(); };
Player.prototype.step = function () {
  this.started = true; this.state = 'idle'; this.ensureAnnounced();
  let i = this.stage;
  if (this.p >= 1) { if (i >= this.n() - 1) { this.sync(); return; } i++; this.go(i, 0); }
  if (RM.matches) { this.go(i, 1); this.sync(); return; }
  this.state = 'stepping'; this.sync(); kick();
};
Player.prototype.jump = function (i) {
  this.started = true; this.state = 'idle'; this.announced = false;
  if (RM.matches) { this.go(i, 1); return; }
  this.go(i, 0); this.state = 'stepping'; this.sync(); kick();
};
Player.prototype.restart = function () { this.state = 'idle'; this.announced = false; this.go(0, 0); if (!RM.matches) this.play(); else this.sync(); };

/* ====================================================== DOM building */
const main = document.getElementById('main');
function mountSection(def) {
  const sec = document.createElement('section');
  sec.className = 'section'; sec.id = def.id; sec.setAttribute('aria-labelledby', def.id + '-h');
  const stagesHtml = def.stages.map((s, i) => `<li><button type="button" data-stage="${i}"><span class="num">${i + 1}</span><span class="nm"></span><span class="prog" aria-hidden="true"></span></button></li>`).join('');
  sec.innerHTML = `
    <p class="eyebrow" data-k="eyebrow"></p><h2 id="${def.id}-h" data-k="title"></h2><p class="meta" data-k="meta"></p><p class="summary" data-k="summary"></p>
    <div class="controls" role="group">
      <button type="button" class="btn" data-act="play"><span class="ic" aria-hidden="true">▶</span><span data-i18n="play"></span></button>
      <button type="button" class="btn" data-act="pause"><span class="ic" aria-hidden="true">❚❚</span><span data-i18n="pause"></span></button>
      <button type="button" class="btn" data-act="step"><span class="ic" aria-hidden="true">⏭</span><span data-i18n="step"></span></button>
      <button type="button" class="btn" data-act="restart"><span class="ic" aria-hidden="true">↺</span><span data-i18n="restart"></span></button>
      <label class="speed"><span data-i18n="speed"></span><select data-act="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      <span class="rmnote" data-k="rm"></span>
    </div>
    <ol class="stages"></ol>
    <div class="grid">
      <aside class="col inputs"><h3 data-i18n="inputs"></h3><ul></ul></aside>
      <div class="stagebox"><div class="stage-scroll"><svg class="sv" viewBox="0 0 1000 620" aria-hidden="true" focusable="false"></svg></div>
        <p class="caption" aria-live="polite" aria-atomic="true"></p></div>
      <aside class="col outputs"><h3 data-i18n="outputs"></h3><ul></ul></aside>
    </div>`;
  sec.querySelector('.stages').innerHTML = stagesHtml;
  main.appendChild(sec);
  const pl = new Player(def, sec); players.push(pl); sec._pl = pl;
  sec.querySelector('[data-act="play"]').addEventListener('click', () => pl.play());
  sec.querySelector('[data-act="pause"]').addEventListener('click', () => pl.pause());
  sec.querySelector('[data-act="step"]').addEventListener('click', () => pl.step());
  sec.querySelector('[data-act="restart"]').addEventListener('click', () => pl.restart());
  sec.querySelector('[data-act="speed"]').addEventListener('change', (e) => { pl.speed = +e.target.value || 1; });
  sec.querySelectorAll('.stages button').forEach((btn) => btn.addEventListener('click', () => pl.jump(+btn.dataset.stage)));
  return sec;
}
function textSection(sec) {
  const def = sec._pl.def;
  ['eyebrow', 'title', 'meta', 'summary'].forEach((k) => { sec.querySelector('[data-k="' + k + '"]').textContent = L(def[k]); });
  sec.querySelector('.controls').setAttribute('aria-label', t('ctrlGroup', { name: L(def.eyebrow) }));
  sec.querySelector('.stages').setAttribute('aria-label', t('stageList'));
  sec.querySelectorAll('.stages button').forEach((btn, i) => {
    btn.querySelector('.nm').textContent = L(def.stages[i].title);
    btn.setAttribute('aria-label', t('stageBtn', { n: i + 1, t: L(def.stages[i].title) }));
  });
  sec.querySelector('[data-k="rm"]').textContent = RM.matches ? t('rmOn') : '';
  sec.querySelector('.inputs ul').innerHTML = def.inputs.map((x) => `<li class="io" data-id="${x.id}"><span class="t">${esc(L(x.t))}</span><span class="p">${esc(x.p)}</span></li>`).join('');
  sec.querySelector('.outputs ul').innerHTML = def.outputs.map((x) => `<li class="io" data-at="${x.at}"><span class="t">${esc(L(x.t))}</span><span class="p">${esc(x.p)}</span><span class="to">${esc(t('usedBy'))} ${x.to.map((id) => `<a href="#${id}">${esc(L(PLACEHOLDERS.find((pp) => pp.id === id).title).split(' · ')[0])}</a>`).join('')}</span></li>`).join('');
}
function mountUpcoming() {
  const sec = document.createElement('section'); sec.className = 'section upcoming'; sec.id = 'upcoming'; sec.setAttribute('aria-labelledby', 'upcoming-h');
  sec.innerHTML = '<h2 id="upcoming-h" data-i18n="comingTitle"></h2><p class="summary" data-i18n="comingIntro"></p><div class="cards"></div>';
  main.appendChild(sec); return sec;
}
function textUpcoming(sec) {
  sec.querySelector('.cards').innerHTML = PLACEHOLDERS.filter((p) => !p.built).map((p) => `
    <article class="ph" id="${p.id}" aria-labelledby="${p.id}-h">
      <h3 id="${p.id}-h">${esc(L(p.title))}</h3>
      <p class="when">${esc(p.int ? t('afterInt') : t('afterBlock', { n: p.n }))}</p>
      <p class="will"><b>${esc(t('willShow'))}</b> ${esc(L(p.will))}</p>
      <b>${esc(t('takesIn'))}</b>
      <ul>${p.inputs.map((x) => `<li class="${x[0] ? 'p0' : ''}">${esc(L(x[1]))}${x[0] ? `<span class="from">· ${esc(t('fromP0'))}</span>` : ''}</li>`).join('')}</ul>
    </article>`).join('');
}
function textChrome() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach((n) => n.setAttribute('aria-label', t(n.dataset.i18nAria)));
  document.querySelectorAll('[data-lang]').forEach((n) => n.setAttribute('aria-pressed', n.dataset.lang === LANG ? 'true' : 'false'));
  document.getElementById('legend').innerHTML =
    `<span><i class="sw d1"></i>${esc(t('lgDev1'))}</span><span><i class="sw d2"></i>${esc(t('lgDev2'))}</span><span><i class="sw ct"></i>${esc(t('lgCt'))}</span>` +
    `<span><b>${esc(t('lgTrust'))}</b></span>` + TRUST.map((x) => `<span class="trust" title="${x[2]}"><span aria-hidden="true">${x[0]}</span>${esc(L(x[1]))}</span>`).join('');
  document.getElementById('secnav').innerHTML = '<ul>' + SECTIONS.map((s) => `<li><a href="#${s.id}">${esc(L(s.nav))}</a></li>`).join('') +
    PLACEHOLDERS.filter((p) => !p.built).map((p) => `<li><a class="dim" href="#${p.id}">${esc(L(p.title).split(' · ')[0])}</a></li>`).join('') + '</ul>';
}
let upcoming;
function applyLang(lang) {
  LANG = lang; store('viz.lang', lang);
  textChrome(); textUpcoming(upcoming);
  players.forEach((pl) => { textSection(pl.root); pl.render(); if (pl.announced) pl.announce(); else pl.cap.textContent = t('ready'); });
}
/* theme */
let THEME = q.get('theme') || store('viz.theme') || 'auto';
function applyTheme(mode) {
  THEME = mode; store('viz.theme', mode);
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mode);
  document.querySelectorAll('[data-theme-set]').forEach((n) => n.setAttribute('aria-pressed', n.dataset.themeSet === mode ? 'true' : 'false'));
}

/* ============================================================ start */
SECTIONS.forEach(mountSection);
upcoming = mountUpcoming();
applyTheme(['auto', 'light', 'dark'].includes(THEME) ? THEME : 'auto');
applyLang(LANG);
document.querySelectorAll('[data-lang]').forEach((n) => n.addEventListener('click', () => applyLang(n.dataset.lang)));
document.querySelectorAll('[data-theme-set]').forEach((n) => n.addEventListener('click', () => applyTheme(n.dataset.themeSet)));
const startStage = parseInt(q.get('stage'), 10);
players.forEach((pl) => {
  if (startStage >= 1 && startStage <= pl.n()) { const sp = parseFloat(q.get('p')); pl.started = true; pl.go(startStage - 1, isFinite(sp) ? clamp(sp, 0, 1) : 1); }
  else { pl.go(0, 0); pl.announced = false; pl.cap.textContent = t('ready'); }
});
RM.addEventListener && RM.addEventListener('change', () => {
  players.forEach((pl) => { if (RM.matches) { pl.state = 'idle'; if (pl.started) pl.go(pl.stage, 1); } textSection(pl.root); pl.sync(); });
});
/* Auto-play once when a section first scrolls into view (never with reduced motion). */
if ('IntersectionObserver' in window && !(startStage >= 1)) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      const pl = en.target._pl;
      if (en.isIntersecting && pl && !pl.started && !RM.matches) { pl.play(); }
      if (en.isIntersecting) io.unobserve(en.target);
    });
  }, { threshold: 0.35 });
  players.forEach((pl) => io.observe(pl.root));
}
})();
</script>
