# uv workspace root (D-022). Members are filled in by their owners:
#   contracts/  -> scrubgpt-contracts (shared; becomes a real package on Phase 0 Day 2)
#   brain/      -> scrubgpt-brain (Dev1)
#   app/server/ -> scrubgpt-app (Dev2)
[project]
name = "scrubgpt"
version = "0.1.0"
description = "ScrubGPT MVP workspace root"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "brain", "app/server"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["contracts", "brain", "app/server"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
