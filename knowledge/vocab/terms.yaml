# A4 Bilingual vocabulary (Dev1). JA/EN terms with synonyms (plan §2.1).
# Used by term normalisation (D5), new-term detection (G4) and the step-recognition prompt (C2).
# The rule book (rulebooks/rarp.yaml) and the taxonomy (taxonomy/obstacles.yaml) refer to terms
# by `id`. Instrument ids are the snake_case `key` used for timeline instrument spans (D-049).
# Draft until a urologist reviews it.

schema_version: 1
review_status: draft_pending_urologist_review
updated: "2026-10-16"

