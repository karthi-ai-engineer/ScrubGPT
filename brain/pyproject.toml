# Brain track (owner: Dev1, D-031): offline pipeline + stateless Brain API, import `scrubgpt_brain`.
# Depends on scrubgpt-contracts through the workspace since contracts-v1.0 (D-051, D-067).
# Add a dependency only when code imports it.
[project]
name = "scrubgpt-brain"
version = "0.1.0"
description = "ScrubGPT Brain: offline pipeline and stateless Brain API (plan §2, Dev1)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # the contracts (Case Package, Procedure Reference, Decision Record, Brain API)
    "scrubgpt-contracts",
    # C3 decoding and C5 pixel signals (array maths; D-063 widened by #14)
    "numpy>=2.3,<3",
    # B3/C1: check that every image written decodes; C5: read frames
    "pillow>=11.0,<13",
    # knowledge/ YAML (rule book, taxonomy, vocabulary; D-062)
    "pyyaml>=6.0.2,<7",
    # the OpenAI gateway's HTTPS transport (brain/CLAUDE.md rule 1; D-063, D-070)
    "httpx>=0.28.1,<1",
    # B2: YouTube metadata and download; [default] adds the YouTube JS solver (yt-dlp-ejs).
    # No upper bound: YouTube breaks old releases within months.
    "yt-dlp[default]>=2026.8",
]

[tool.uv.sources]
scrubgpt-contracts = { workspace = true }

[project.scripts]
scrubgpt-brain = "scrubgpt_brain.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout like contracts/ (D-031): the package lives at brain/scrubgpt_brain/.
module-name = "scrubgpt_brain"
module-root = ""
